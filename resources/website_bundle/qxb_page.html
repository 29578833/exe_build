                function getBowerInfo(){
                    var bower

                    if (explorer.indexOf("msie") >= 0) {
                        var ver = explorer.match(/msie ([\d.]+)/)[1];

                        bower = {
                            type: 'Edge'

                        //Chrome

                function extend(des, src, override) {
                    if (src instanceof Array) {

                    } else {
